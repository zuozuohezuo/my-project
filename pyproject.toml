[project]
name = "ming-dynasty-simulator"
version = "0.1.0"
description = "A data-driven Ming dynasty emperor simulator framework"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
dynasty = "dynasty.__main__:main"

[project.gui-scripts]
dynasty-gui = "dynasty.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.12", "pyinstaller>=6.15"]
research = ["httpx>=0.28", "beautifulsoup4>=4.13", "lxml>=5.4", "opencc-python-reimplemented>=0.1.7"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynasty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
